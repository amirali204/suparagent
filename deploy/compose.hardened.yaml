# Experimental pilot only: run with -f compose.yaml -f deploy/compose.hardened.yaml.
# This overlay does not expose a new port or mount any host path.
# It deliberately keeps the default loopback-only host bind from compose.yaml.
services:
  suparagent:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /run:rw,nosuid,nodev,size=16m
